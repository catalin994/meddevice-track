<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediTrack</title>
    <meta name="theme-color" content="#f8fafc" />
    <script>
      // Polyfill process.env to prevent ReferenceError on mobile devices where 'process' is undefined
      window.process = window.process || { env: {} };

      // Set the theme before the bundle loads, otherwise every dark-mode start
      // flashes a white page until React's first effect runs.
      try {
        var t = localStorage.getItem('meditrack_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1120');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="app-bg text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
